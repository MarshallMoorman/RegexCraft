name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No secrets required for basic CI.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore RegexCraft.sln

      - name: Build (Debug)
        run: dotnet build RegexCraft.sln -c Debug --no-restore

      - name: Build (Release)
        run: dotnet build RegexCraft.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test RegexCraft.sln
          -c Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory "${{ github.workspace }}/TestResults"
          --verbosity normal

      - name: Upload test results (TRX)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/**
          if-no-files-found: ignore
          retention-days: 14

      # Headless screenshot tests are part of the full suite above (Category=Screenshots).
      # Upload any PNGs produced under docs/screenshots when present.
      - name: Upload screenshot artifacts
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-ubuntu
          path: docs/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
