# Build, test, publish RID zips on version tags.
# Binaries are uploaded to the PUBLIC dist repo (default: MarshallMoorman/RegexCraft-Releases).
# Requires repository secret DIST_REPO_TOKEN with contents:write on the dist repo.
# See docs/development/commercial.md and docs/development/packaging.md.

name: Publish

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug
      self_contained:
        description: "Self-contained publish (includes runtime)"
        required: true
        default: true
        type: boolean
      publish_to_dist:
        description: "Also create release on public dist repo (needs DIST_REPO_TOKEN)"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

env:
  DIST_REPO: MarshallMoorman/RegexCraft-Releases

permissions:
  contents: write

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-pub-test-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-pub-test-
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore RegexCraft.sln

      - name: Build (Release)
        run: dotnet build RegexCraft.sln -c Release --no-restore

      - name: Test
        run: |
          dotnet test RegexCraft.sln \
            -c Release \
            --no-build \
            --filter "Category!=Screenshots" \
            --verbosity normal \
            -- NUnit.NumberOfTestWorkers=1

  publish:
    name: Publish ${{ matrix.rid }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-x64
            os: macos-latest
          - rid: osx-arm64
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-pub-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-pub-

      - name: Resolve configuration
        id: cfg
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "configuration=${{ inputs.configuration }}" >> "$GITHUB_OUTPUT"
            echo "self_contained=${{ inputs.self_contained }}" >> "$GITHUB_OUTPUT"
          else
            echo "configuration=Release" >> "$GITHUB_OUTPUT"
            echo "self_contained=true" >> "$GITHUB_OUTPUT"
          fi

      # MSYS/Git-Bash on Windows converts args that look like Unix paths (/p:...).
      # Use -p: (dash form) and disable conversion for safety.
      - name: Publish
        shell: bash
        env:
          MSYS_NO_PATHCONV: 1
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          set -e
          OUT="artifacts/RegexCraft-${{ matrix.rid }}"
          mkdir -p "$OUT"
          SC="${{ steps.cfg.outputs.self_contained }}"
          # Avoid /p: switches — Git Bash on windows-latest mangles them into extra "projects".
          dotnet publish src/RegexCraft.App/RegexCraft.App.csproj \
            -c "${{ steps.cfg.outputs.configuration }}" \
            -r "${{ matrix.rid }}" \
            --self-contained "$SC" \
            -o "$OUT" \
            -p:PublishSingleFile=false \
            -p:IncludeNativeLibrariesForSelfExtract=true
          echo "Published to $OUT"
          # Do not pipe ls into head under pipefail — SIGPIPE fails the step on Linux.
          ls -la "$OUT" || true

      - name: Zip artifact
        shell: bash
        run: |
          set -e
          cd artifacts
          if command -v zip >/dev/null 2>&1; then
            zip -r "RegexCraft-${{ matrix.rid }}.zip" "RegexCraft-${{ matrix.rid }}"
          elif command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -Command \
              "Compress-Archive -Path 'RegexCraft-${{ matrix.rid }}' -DestinationPath 'RegexCraft-${{ matrix.rid }}.zip' -Force"
          elif command -v powershell >/dev/null 2>&1; then
            powershell -NoProfile -Command \
              "Compress-Archive -Path 'RegexCraft-${{ matrix.rid }}' -DestinationPath 'RegexCraft-${{ matrix.rid }}.zip' -Force"
          else
            tar -czf "RegexCraft-${{ matrix.rid }}.tar.gz" "RegexCraft-${{ matrix.rid }}"
          fi
          ls -la || true

      - name: Upload published folder
        uses: actions/upload-artifact@v4
        with:
          name: RegexCraft-${{ matrix.rid }}
          path: artifacts/RegexCraft-${{ matrix.rid }}/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: RegexCraft-${{ matrix.rid }}-archive
          path: |
            artifacts/RegexCraft-${{ matrix.rid }}.zip
            artifacts/RegexCraft-${{ matrix.rid }}.tar.gz
          if-no-files-found: ignore
          retention-days: 30

  # Public dist release (tag always; workflow_dispatch only if publish_to_dist).
  dist-release:
    name: Public dist release
    needs: publish
    if: >-
      always() &&
      needs.test.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'partialSuccess' || needs.publish.result == 'failure') &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_to_dist == true)
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require DIST_REPO_TOKEN
        env:
          DIST_REPO_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
        run: |
          if [ -z "$DIST_REPO_TOKEN" ]; then
            echo "::error::DIST_REPO_TOKEN secret is not set. Create a fine-scoped PAT with contents:write on ${{ env.DIST_REPO }} and add it as a repo secret. See docs/development/commercial.md."
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
        continue-on-error: true

      - name: Package archives for release
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-upload
          find release-assets -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print -exec cp {} release-upload/ \; || true

          if [ -z "$(ls -A release-upload 2>/dev/null || true)" ]; then
            for dir in release-assets/RegexCraft-*; do
              [ -d "$dir" ] || continue
              base=$(basename "$dir")
              if [[ "$base" == *-archive ]]; then
                continue
              fi
              if [ -f "$dir/RegexCraft.App.dll" ] || [ -f "$dir/RegexCraft.App" ] || [ -f "$dir/RegexCraft.App.exe" ]; then
                tar -czf "release-upload/${base}.tar.gz" -C "$dir" .
              fi
            done
          fi

          echo "=== Release upload contents ==="
          ls -la release-upload || true
          count=$(find release-upload -type f \( -name '*.zip' -o -name '*.tar.gz' \) | wc -l | tr -d ' ')
          echo "archive_count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "::error::No publish archives found. Refusing to create an empty dist release."
            exit 1
          fi

          # SHA256 checksums (nice-to-have for integrity)
          (
            cd release-upload
            for f in *.zip *.tar.gz; do
              [ -f "$f" ] || continue
              sha256sum "$f" >> SHA256SUMS.txt
            done
            ls -la SHA256SUMS.txt || true
          )

      - name: Extract CHANGELOG section for this version
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ startsWith(github.ref, 'refs/tags/v') }}" != "true" ]; then
            TAG="manual-${{ github.run_number }}"
            VER="manual"
          else
            TAG="${GITHUB_REF_NAME}"
            VER="${TAG#v}"
          fi
          NOTES_FILE=release-notes.md
          {
            echo "## RegexCraft ${TAG}"
            echo ""
            echo "Portable self-contained builds for major desktop RIDs."
            echo ""
            echo "**Product site:** https://regexcraft.com"
            echo ""
            echo "**License:** Free for personal use. Business / commercial use requires a paid license"
            echo "(honor system — no keys). See https://regexcraft.com/eula.html and https://regexcraft.com/pricing.html"
            echo ""
            echo "This repository hosts **binaries only**. Application source is proprietary."
            echo ""
            echo "### Downloads"
            echo ""
            echo "| Archive | Platform |"
            echo "|---------|----------|"
            echo "| \`RegexCraft-win-x64.zip\` | Windows x64 |"
            echo "| \`RegexCraft-linux-x64.zip\` | Linux x64 |"
            echo "| \`RegexCraft-osx-x64.zip\` | macOS Intel |"
            echo "| \`RegexCraft-osx-arm64.zip\` | macOS Apple Silicon |"
            echo ""
            echo "Unzip and run \`RegexCraft.App\` (or \`RegexCraft.App.exe\` on Windows) from the extracted folder."
            echo ""
            echo "### Checksums"
            echo ""
            echo "See \`SHA256SUMS.txt\` attached to this release when present."
            echo ""
            echo "### Changelog"
            echo ""
          } > "$NOTES_FILE"

          if [ -f docs/CHANGELOG.md ] && [ "$VER" != "manual" ]; then
            awk -v ver="$VER" '
              BEGIN { p=0 }
              $0 ~ "^## \\[" ver "\\]" { p=1; print; next }
              p && $0 ~ /^## / { exit }
              p { print }
            ' docs/CHANGELOG.md >> "$NOTES_FILE" || true
          fi

          if [ "$VER" != "manual" ] && ! grep -q "## \\[${VER}\\]" "$NOTES_FILE" 2>/dev/null; then
            echo "_No matching CHANGELOG section for ${VER}._" >> "$NOTES_FILE"
          fi

          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "=== Release notes preview ==="
          head -80 "$NOTES_FILE"

      - name: Create release on public dist repo
        uses: softprops/action-gh-release@v2
        with:
          # Must be explicit: action default is github.token (main repo only), which
          # cannot create releases on the external dist repo (403).
          token: ${{ secrets.DIST_REPO_TOKEN }}
          repository: ${{ env.DIST_REPO }}
          tag_name: ${{ steps.notes.outputs.tag_name }}
          name: RegexCraft ${{ steps.notes.outputs.tag_name }}
          body_path: ${{ steps.notes.outputs.notes_file }}
          generate_release_notes: false
          files: |
            release-upload/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(steps.notes.outputs.tag_name, '-') || contains(steps.notes.outputs.tag_name, 'rc') || contains(steps.notes.outputs.tag_name, 'beta') || contains(steps.notes.outputs.tag_name, 'alpha') }}

      - name: Ensure dist repo README
        env:
          GH_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
        run: |
          set -euo pipefail
          # Best-effort: seed/update README on dist default branch (binaries-only notice).
          # Failures here do not fail the release (assets already uploaded).
          TMP=$(mktemp -d)
          cd "$TMP"
          if ! gh repo clone "${{ env.DIST_REPO }}" dist -- --depth 1; then
            mkdir dist && cd dist
            git init
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ env.DIST_REPO }}.git"
            git checkout -b main
          else
            cd dist
          fi

          cp "$GITHUB_WORKSPACE/docs/development/dist-repo-README.md" README.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README unchanged"
          else
            git commit -m "docs: keep dist README (binaries only)"
            git push -u origin HEAD:main || git push origin HEAD:main || true
          fi
        continue-on-error: true
