name: Publish

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug
      self_contained:
        description: "Self-contained publish (includes runtime)"
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"

# Publish does not require secrets for artifact upload.
# Creating a GitHub Release uses the default GITHUB_TOKEN.

permissions:
  contents: write

jobs:
  # Fail fast on broken code before spending matrix minutes on publish.
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-pub-test-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-pub-test-
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore RegexCraft.sln

      - name: Build (Release)
        run: dotnet build RegexCraft.sln -c Release --no-restore

      - name: Test
        run: |
          dotnet test RegexCraft.sln \
            -c Release \
            --no-build \
            --filter "Category!=Screenshots" \
            --verbosity normal \
            -- NUnit.NumberOfTestWorkers=1

  publish:
    name: Publish ${{ matrix.rid }}
    needs: test
    runs-on: ${{ matrix.os }}
    # Soft-fail per RID: one platform failing does not cancel the others.
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-x64
            os: macos-latest
          - rid: osx-arm64
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-pub-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-pub-

      - name: Resolve configuration
        id: cfg
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "configuration=${{ inputs.configuration }}" >> "$GITHUB_OUTPUT"
            echo "self_contained=${{ inputs.self_contained }}" >> "$GITHUB_OUTPUT"
          else
            echo "configuration=Release" >> "$GITHUB_OUTPUT"
            echo "self_contained=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        shell: bash
        run: |
          OUT="artifacts/RegexCraft-${{ matrix.rid }}"
          mkdir -p "$OUT"
          SC_FLAG="--self-contained ${{ steps.cfg.outputs.self_contained }}"
          dotnet publish src/RegexCraft.App/RegexCraft.App.csproj \
            -c "${{ steps.cfg.outputs.configuration }}" \
            -r "${{ matrix.rid }}" \
            $SC_FLAG \
            -o "$OUT" \
            /p:PublishSingleFile=false \
            /p:IncludeNativeLibrariesForSelfExtract=true
          echo "Published to $OUT"
          ls -la "$OUT" | head -40

      - name: Zip artifact
        shell: bash
        run: |
          cd artifacts
          # Prefer zip on all platforms. Windows runners often lack zip(1).
          if command -v zip >/dev/null 2>&1; then
            zip -r "RegexCraft-${{ matrix.rid }}.zip" "RegexCraft-${{ matrix.rid }}"
          elif command -v powershell >/dev/null 2>&1 || command -v pwsh >/dev/null 2>&1; then
            PS=$(command -v pwsh || command -v powershell)
            "$PS" -NoProfile -Command \
              "Compress-Archive -Path 'RegexCraft-${{ matrix.rid }}' -DestinationPath 'RegexCraft-${{ matrix.rid }}.zip' -Force"
          else
            tar -czf "RegexCraft-${{ matrix.rid }}.tar.gz" "RegexCraft-${{ matrix.rid }}"
          fi
          ls -la

      - name: Upload published folder
        uses: actions/upload-artifact@v4
        with:
          name: RegexCraft-${{ matrix.rid }}
          path: artifacts/RegexCraft-${{ matrix.rid }}/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: RegexCraft-${{ matrix.rid }}-archive
          path: |
            artifacts/RegexCraft-${{ matrix.rid }}.zip
            artifacts/RegexCraft-${{ matrix.rid }}.tar.gz
          if-no-files-found: ignore
          retention-days: 30

  release:
    name: GitHub Release (on tag)
    needs: publish
    # Create a release even if some RIDs failed, as long as at least one published.
    # If every publish job failed, this job is skipped (no empty release).
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.test.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'partialSuccess' || needs.publish.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
        continue-on-error: true

      - name: Package archives for release
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-upload
          # Prefer zip / tar.gz archives produced by the matrix jobs
          find release-assets -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print -exec cp {} release-upload/ \; || true

          if [ -z "$(ls -A release-upload 2>/dev/null || true)" ]; then
            for dir in release-assets/RegexCraft-*; do
              [ -d "$dir" ] || continue
              base=$(basename "$dir")
              # Skip *-archive artifact dirs that only hold archives
              if [[ "$base" == *-archive ]]; then
                continue
              fi
              if [ -f "$dir/RegexCraft.App.dll" ] || [ -f "$dir/RegexCraft.App" ] || [ -f "$dir/RegexCraft.App.exe" ]; then
                tar -czf "release-upload/${base}.tar.gz" -C "$dir" .
              fi
            done
          fi

          echo "=== Release upload contents ==="
          ls -la release-upload || true
          count=$(find release-upload -type f \( -name '*.zip' -o -name '*.tar.gz' \) | wc -l | tr -d ' ')
          echo "archive_count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "::error::No publish archives found. Refusing to create an empty GitHub Release."
            exit 1
          fi

      - name: Extract CHANGELOG section for this version
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Strip leading v for version match (v1.0.0 → 1.0.0)
          VER="${TAG#v}"
          NOTES_FILE=release-notes.md
          {
            echo "## RegexCraft ${TAG}"
            echo ""
            echo "Portable self-contained builds for major desktop RIDs."
            echo "Version is sourced from \`Directory.Build.props\`."
            echo ""
            echo "### Downloads"
            echo ""
            echo "| Archive | Platform |"
            echo "|---------|----------|"
            echo "| \`RegexCraft-win-x64.zip\` | Windows x64 |"
            echo "| \`RegexCraft-linux-x64.zip\` | Linux x64 |"
            echo "| \`RegexCraft-osx-x64.zip\` | macOS Intel |"
            echo "| \`RegexCraft-osx-arm64.zip\` | macOS Apple Silicon |"
            echo ""
            echo "Unzip and run \`RegexCraft.App\` (or \`RegexCraft.App.exe\` on Windows) from the extracted folder."
            echo ""
            echo "### Changelog"
            echo ""
          } > "$NOTES_FILE"

          if [ -f docs/CHANGELOG.md ]; then
            # Extract ## [VER] section until next ## heading
            awk -v ver="$VER" '
              BEGIN { p=0 }
              $0 ~ "^## \\[" ver "\\]" { p=1; print; next }
              p && $0 ~ /^## / { exit }
              p { print }
            ' docs/CHANGELOG.md >> "$NOTES_FILE" || true
          fi

          if ! grep -q "## \\[${VER}\\]" "$NOTES_FILE" 2>/dev/null; then
            echo "_No matching CHANGELOG section for ${VER}; see docs/CHANGELOG.md in the repository._" >> "$NOTES_FILE"
          fi

          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          echo "=== Release notes preview ==="
          head -80 "$NOTES_FILE"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: RegexCraft ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.notes_file }}
          generate_release_notes: true
          files: release-upload/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
